<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether (以太) | 次世代社交</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; }
        .hidden { display: none !important; }
        #app { max-width: 400px; width: 100%; height: 90vh; background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); border-radius: 24px; box-shadow: 0 8px 32px rgba(31,38,135,0.15); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .auth-container { padding: 40px 30px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .app-title { font-size: 32px; font-weight: 600; color: #3b4252; margin-bottom: 5px; }
        .app-subtitle { font-size: 13px; color: #5e81ac; margin-bottom: 30px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 14px; margin: 10px 0; background: rgba(255,255,255,0.8); border: 1px solid #e5e9f0; border-radius: 12px; box-sizing: border-box; outline: none; }
        
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 600; margin-top: 15px; }
        .btn-outline { background: transparent; color: #764ba2; border: 2px solid #764ba2; margin-top: 10px; }
        
        .chat-header { background: rgba(255,255,255,0.5); padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.5); font-weight: 600; color: #2e3440; backdrop-filter: blur(5px); cursor: pointer; position: relative; }
        .admin-btn { position: absolute; right: 20px; top: 22px; font-size: 12px; color: #88c0d0; cursor: pointer; }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; align-items: flex-end; gap: 10px; }
        .message.self { flex-direction: row-reverse; }
        .message-content { background: white; padding: 12px 16px; border-radius: 18px 18px 18px 4px; max-width: 70%; word-wrap: break-word; font-size: 14px; color: #4c566a; }
        .message.self .message-content { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); border-radius: 18px 18px 4px 18px; color: #2e3440; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #eceff4; }
        
        .chat-input-area { padding: 15px; background: rgba(255,255,255,0.5); border-top: 1px solid rgba(255,255,255,0.5); }
        .toolbar { display: flex; gap: 18px; margin-bottom: 12px; color: #5e81ac; padding: 0 5px; }
        .toolbar svg { width: 22px; height: 22px; cursor: pointer; }
        .input-wrapper { display: flex; gap: 10px; }
