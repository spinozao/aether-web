<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虫洞漂流 | Wormhole Drifting</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@300;400;700&display=swap');
        
        /* 核心宇宙背景：模仿 Gemini 深邃呼吸感 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; background-color: #050510; }
        .universe-bg {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; z-index: 1; pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #151835 0%, #080816 40%, #000000 100%);
            animation: cosmicBreath 20s ease-in-out infinite alternate;
        }
        @keyframes cosmicBreath {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* 顶部 UI 悬浮层 */
        .hud-bar { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; pointer-events: none; }
        .site-logo { color: #e2e8f0; font-family: 'ZCOOL QingKe HuangYou', cursive; font-size: 28px; text-shadow: 0 0 15px rgba(255,255,255,0.5); letter-spacing: 2px; }
        .hud-controls { pointer-events: auto; display: flex; gap: 15px; align-items: center; }
        .glass-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.3s; font-size: 13px; }
        .glass-btn:hover { background: rgba(255,255,255,0.2); box-shadow: 0 0 15px rgba(255,255,255,0.3); }

        /* 虫洞空间（存放星星） */
        .space-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; overflow: hidden; }
        
        /* 星星动画物理引擎 */
        @keyframes floatStar {
            0% { transform: translate(0, 0); }
            33% { transform: translate(15px, -20px); }
            66% { transform: translate(-10px, 15px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes starBreathe {
            0% { box-shadow: 0 0 10px 2px rgba(180,200,255,0.3); opacity: 0.7; }
            50% { box-shadow: 0 0 25px 8px rgba(180,200,255,0.8); opacity: 1; }
            100% { box-shadow: 0 0 10px 2px rgba(180,200,255,0.3); opacity: 0.7; }
        }
        .star { position: absolute; background: #fff; border-radius: 50%; cursor: pointer; animation: floatStar 15s infinite ease-in-out, starBreathe 4s infinite ease-in-out; transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .star:hover { transform: scale(1.5) !important; z-index: 20; background: #cce0ff; box-shadow: 0 0 40px 15px rgba(180,200,255,1); }

        /* 模态框统一玻璃拟态面板 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 500; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .glass-panel { background: rgba(20, 20, 35, 0.7); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05); border-radius: 24px; padding: 30px; width: 90%; max-width: 500px; color: #fff; position: relative; max-height: 85vh; display: flex; flex-direction: column; }
        .close-btn { position: absolute; top: 20px; right: 25px; cursor: pointer; color: #888; font-size: 24px; transition: 0.2s; }
        .close-btn:hover { color: #fff; text-shadow: 0 0 10px #fff; }

        /* 登录/发帖输入框 */
        input[type="text"], input[type="password"], textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; outline: none; font-family: inherit; }
        textarea { resize: none; height: 100px; }
        input:focus, textarea:focus { border-color: rgba(180,200,255,0.6); box-shadow: 0 0 10px rgba(180,200,255,0.2); }

        /* 帖子内容视窗 */
        .post-scroll-area { overflow-y: auto; flex: 1; padding-right: 10px; margin-bottom: 20px; }
        .post-scroll-area::-webkit-scrollbar { width: 6px; }
        .post-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .user-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .user-meta img { width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #000; }
        .planet-tag { font-size: 11px; color: #a0aec0; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
        .post-body { font-size: 15px; line-height: 1.6; color: #e2e8f0; margin-bottom: 15px; word-break: break-all; }
        .post-img { max-width: 100%; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        audio { height: 35px; border-radius: 20px; outline: none; margin-bottom: 15px; width: 100%; }

        /* 回复区 */
        .reply-item { border-top: 1px solid rgba(255,255,255,0.1); padding: 15px 0; }
        .editor-tools { display: flex; gap: 10px; margin-bottom: 15px; }
        .tool-btn { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 13px; }
        .tool-btn.recording { background: rgba(255, 60, 60, 0.4); border-color: red; animation: starBreathe 1s infinite; }

        .admin-del { float: right; color: #ff4d4f; font-size: 12px; cursor: pointer; display: none; }
    </style>
</head>
<body>
    <div class="universe-bg"></div>
    
    <div class="hud-bar">
        <div class="site-logo">虫洞漂流</div>
        <div class="hud-controls" id="guest-controls">
            <span style="color:#a0aec0; font-size:13px; display:none;" id="user-info-display"></span>
            <button class="glass-btn" onclick="openModal('auth-modal')" id="login-btn">空间站登录</button>
            <button class="glass-btn" onclick="openModal('create-modal')" id="create-btn" style="display:none; box-shadow:0 0 15px rgba(255,255,255,0.4);">发射讯号</button>
            <button class="glass-btn" onclick="logout()" id="logout-btn" style="display:none;">脱离</button>
        </div>
    </div>

    <!-- 宇宙空间容纳星星 -->
    <div class="space-container" id="space-container"></div>

    <!-- 登录/注册模块 -->
    <div class="modal-overlay" id="auth-modal">
        <div class="glass-panel">
            <div class="close-btn" onclick="closeModal('auth-modal')">×</div>
            <h2 style="margin-top:0;">空间站认证</h2>
            <p style="color:#a0aec0; font-size:13px; margin-bottom:20px;">首次建立连接将自动为您分配随机星系归属地与超现实人格。</p>
            <input type="text" id="username" placeholder="输入星际频率 (ID)">
            <input type="password" id="password" placeholder="设置独立暗号 (密码)">
            <button class="glass-btn" style="width:100%; margin-top:10px; font-size:16px;" onclick="handleAuth(false)">初始化跃迁 (注册)</button>
            <button class="glass-btn" style="width:100%; margin-top:10px; background:transparent;" onclick="handleAuth(true)">返回母星 (登录)</button>
            <p id="auth-msg" style="color:#ff8a8a; font-size:12px; text-align:center; margin-top:10px;"></p>
        </div>
    </div>

    <!-- 发送信号 (发帖) 模块 -->
    <div class="modal-overlay" id="create-modal">
        <div class="glass-panel">
            <div class="close-btn" onclick="closeModal('create-modal')">×</div>
            <h2 style="margin-top:0;">向宇宙广播</h2>
            <textarea id="post-content" placeholder="输入你要留在太空中的话..."></textarea>
            
            <div class="editor-tools">
                <label class="tool-btn">📸 添加影像<input type="file" id="post-img" accept="image/*" style="display:none;"></label>
                <button class="tool-btn" id="post-record-btn" onclick="toggleRecording('post')">🎤 录制语音(30s)</button>
            </div>
            <div id="post-preview" style="margin-bottom:10px; color:#a0aec0; font-size:12px;"></div>

            <button class="glass-btn" style="width:100%; font-size:16px; background:rgba(255,255,255,0.2);" onclick="submitStar()">将这颗星星推入轨道</button>
            <p id="pub-msg" style="color:#ff8a8a; font-size:12px; text-align:center; margin-top:10px;"></p>
        </div>
    </div>

    <!-- 阅读/回复 模块 -->
    <div class="modal-overlay" id="read-modal">
        <div class="glass-panel" style="max-width: 600px; width:95%; height: 85vh;">
            <div class="close-btn" onclick="closeModal('read-modal')">×</div>
            <div class="post-scroll-area" id="read-content-area">
                <!-- 动态填充主贴和回复 -->
            </div>
            
            <!-- 回复工具栏 (仅登录可见) -->
            <div id="reply-box" style="display:none; border-top:1px solid rgba(255,255,255,0.1); padding-top:15px;">
                <textarea id="reply-content" placeholder="向该星标发送回音..." style="height: 60px;"></textarea>
                <div class="editor-tools">
                    <label class="tool-btn">📸<input type="file" id="reply-img" accept="image/*" style="display:none;"></label>
                    <button class="tool-btn" id="reply-record-btn" onclick="toggleRecording('reply')">🎤</button>
                    <button class="glass-btn" style="flex:2;" onclick="submitReply()">发送回音</button>
                </div>
                <div id="reply-preview" style="color:#a0aec0; font-size:12px;"></div>
            </div>
        </div>
    </div>

<script>
    const API_BASE = "https://aether-api.huumoo-bc5.workers.dev"; // 保持你自己的云端节点

    let currentUser = null;
    let activeStarId = null;
    let starsData = [];

    // --- 音频录制引擎 ---
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordTimeout = null;
    let currentAudioBase64 = { post: null, reply: null };

    async function handleAuth(isLogin) {
        const u = document.getElementById('username').value, p = document.getElementById('password').value;
        const msg = document.getElementById('auth-msg');
        if (!u || !p) return msg.innerText = "信号缺失";
        msg.innerText = "跨越虫洞中...";
        try {
            const res = await fetch(API_BASE + (isLogin ? "/api/login" : "/api/register"), {
                method: "POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({username:u, password:p})
            });
            const data = await res.json();
            if(data.error) throw new Error(data.error);
            currentUser = data.profile;
            closeModal('auth-modal');
            refreshUI();
        } catch (e) { msg.innerText = e.message; }
    }

    function refreshUI() {
        if (currentUser) {
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('create-btn').style.display = 'block';
            document.getElementById('logout-btn').style.display = 'block';
            const info = document.getElementById('user-info-display');
            info.style.display = 'block';
            info.innerHTML = `来自: ${currentUser.planet} <img src="${currentUser.avatar}" style="width:20px; vertical-align:middle; border-radius:50%; background:#000; margin-left:5px;">`;
            document.getElementById('reply-box').style.display = 'block'; // 开启回复权限
        } else {
            document.getElementById('login-btn').style.display = 'block';
            document.getElementById('create-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('user-info-display').style.display = 'none';
            document.getElementById('reply-box').style.display = 'none';
        }
        loadUniverse();
    }

    function logout() { currentUser = null; refreshUI(); }

    // --- 宇宙渲染引擎 ---
    async function loadUniverse() {
        try {
            const res = await fetch(API_BASE + "/api/stars");
            starsData = await res.json();
            const container = document.getElementById('space-container');
            container.innerHTML = '';
            
            starsData.forEach(star => {
                const el = document.createElement('div');
                el.className = 'star';
                // 随机大小 (10px ~ 35px) 和随机位置 (10% ~ 90%)
                const size = Math.random() * 25 + 10;
                el.style.width = size + 'px'; el.style.height = size + 'px';
                el.style.left = (Math.random() * 80 + 10) + '%';
                el.style.top = (Math.random() * 80 + 10) + '%';
                // 星星的透明度和颜色基于内容丰富度
                if(star.image_data || star.audio_data) el.style.boxShadow = "0 0 15px 4px rgba(255,100,150,0.6)";
                
                el.onclick = () => openStar(star);
                container.appendChild(el);
            });
        } catch (e) { console.error("天文台信号中断", e); }
    }

    async function openStar(star) {
        activeStarId = star.id;
        openModal('read-modal');
        const area = document.getElementById('read-content-area');
        area.innerHTML = "<div style='text-align:center; color:#888;'>正在解析来自 " + star.planet + " 的信号...</div>";
        
        try {
            const res = await fetch(API_BASE + "/api/replies/" + star.id);
            const replies = await res.json();
            
            let html = buildPostHTML(star, true);
            if(replies.length > 0) {
                html += `<div style="margin:20px 0; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:5px; color:#888; font-size:13px;">星际回音 (${replies.length})</div>`;
                replies.forEach(r => html += buildPostHTML(r, false));
            } else {
                html += `<div style="margin-top:30px; text-align:center; color:#555; font-size:13px;">这颗星球静悄悄的，做第一个回应的人吧。</div>`;
            }
            area.innerHTML = html;
        } catch(e) { area.innerHTML = "信号受损，无法读取。"; }
    }

    function buildPostHTML(data, isMain) {
        let mediaHtml = '';
        if(data.image_data) mediaHtml += `<img src="${data.image_data}" class="post-img">`;
        if(data.audio_data) mediaHtml += `<audio src="${data.audio_data}" controls></audio>`;
        
        let delBtn = (currentUser && currentUser.role === 'admin' && isMain) 
            ? `<span class="admin-del" onclick="deleteStar(${data.id})">毁灭星球</span>` : '';

        return `
            <div class="${isMain ? '' : 'reply-item'}">
                <div class="user-meta">
                    <img src="${data.avatar_url}">
                    <div>
                        <div style="font-weight:bold;">${data.nickname} ${delBtn}</div>
                        <span class="planet-tag">📍 ${data.planet}</span>
                        <span style="font-size:11px; color:#666; margin-left:10px;">${new Date(data.created_at).toLocaleString()}</span>
                    </div>
                </div>
                <div class="post-body">${data.content}</div>
                ${mediaHtml}
            </div>
        `;
    }

    // --- 图像极速压缩引擎 ---
    function compressImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = Math.min(600 / img.width, 1); // 限制宽度防止超载
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
        });
    }

    // --- 语音录制 (最大 30s) ---
    async function toggleRecording(type) {
        const btn = document.getElementById(`${type}-record-btn`);
        const preview = document.getElementById(`${type}-preview`);
        
        if (isRecording) {
            mediaRecorder.stop();
            btn.classList.remove('recording');
            btn.innerText = "🎤";
            clearTimeout(recordTimeout);
            isRecording = false;
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        currentAudioBase64[type] = reader.result;
                        preview.innerText = "✅ 截获了一段电波信号";
                    };
                    stream.getTracks().forEach(t => t.stop()); // 关闭麦克风
                };
                
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
                btn.innerText = "录音中(点击停止)";
                
                // 30秒强制停止
                recordTimeout = setTimeout(() => { if(isRecording) toggleRecording(type); }, 30000);
            } catch(e) { alert("空间站麦克风许可未开启！"); }
        }
    }

    // --- 数据发射 ---
    async function submitPostData(type, url) {
        const content = document.getElementById(`${type}-content`).value.trim();
        const fileInput = document.getElementById(`${type}-img`);
        let base64Img = null;
        
        if(!content && !fileInput.files[0] && !currentAudioBase64[type]) return alert("信号太空旷了，写点什么吧。");
        
        document.getElementById('pub-msg').innerText = "发射包裹中...";
        if(fileInput.files[0]) base64Img = await compressImage(fileInput.files[0]);

        try {
            const res = await fetch(url, {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    username: currentUser.username, nickname: currentUser.nickname,
                    avatar: currentUser.avatar, planet: currentUser.planet,
                    content: content, image_data: base64Img, audio_data: currentAudioBase64[type]
                })
            });
            if (!res.ok) throw new Error("发射被引力波阻断");
            
            // 归零清理
            document.getElementById(`${type}-content`).value = "";
            fileInput.value = "";
            currentAudioBase64[type] = null;
            if(document.getElementById(`${type}-preview`)) document.getElementById(`${type}-preview`).innerText = "";
            
            if(type === 'post') { closeModal('create-modal'); loadUniverse(); }
            if(type === 'reply') { openStar({id: activeStarId, planet: '当前轨道'}); } // 刷新回复列表
        } catch (e) { alert(e.message); }
    }

    function submitStar() { submitPostData('post', API_BASE + "/api/stars"); }
    function submitReply() { submitPostData('reply', API_BASE + "/api/replies/" + activeStarId); }

    // --- 管理员毁灭权限 ---
    async function deleteStar(id) {
        if(confirm("警告：使用湮灭武器将彻底抹除这颗星球及其所有回音，是否确认？")) {
            await fetch(API_BASE + "/api/admin/delete/" + id, { method: "DELETE" });
            closeModal('read-modal');
            loadUniverse();
        }
    }

    // --- UI 基础 ---
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // 启动雷达扫描
    refreshUI();
</script>
</body>
</html>
